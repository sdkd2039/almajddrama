<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
:root {
  --bg-color:#0f172a;
  --card-bg:#1e293b;
  --text-color:#f8fafc;
  --primary-color:#0284c7;
  --primary-hover:#0369a1;
  --text-muted:#94a3b8;
  --accent-gold:#ffd700;
  --player-bg:#151f32;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Tajawal',sans-serif;
}

html { width:100%; min-height:100%; }
body {
  background:var(--bg-color);
  color:var(--text-color);
  min-height:100vh;
  padding:clamp(10px,2.2vw,28px);
  overflow-x:hidden;
}
body.is-embedded {
  padding:0;
  background:transparent;
}
body.is-embedded #playersList {
  padding:0;
  gap:0;
}
body.is-embedded .page-container {
  max-width:none;
  width:100%;
  min-height:0;
  margin:0;
  border-radius:clamp(12px,2vw,22px);
  box-shadow:none;
}

#playersList {
  width:100%;
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  align-items:start;
  gap:clamp(14px,2vw,24px);
}
#playersList:has(.page-container:nth-child(2)) {
  grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));
}

.page-container {
  width:100%;
  min-width:0;
  max-width:760px;
  justify-self:center;
  background:var(--card-bg);
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  padding:25px 30px;
  display:flex;
  flex-direction:column;
  gap:22px;
  border:1px solid rgba(255,255,255,.05);
}

.top-meta-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  gap:20px;
}

.meta-container {
  display:flex;
  align-items:center;
  gap:20px;
  text-align:right;
  min-width:0;
}

.poster-container {
  width:90px;
  height:90px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
  overflow:hidden;
  border:2px solid rgba(255,255,255,.1);
  flex-shrink:0;
}

.poster-container img {

  height:100%;
  object-fit:cover;
}

.track-info {
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.track-title {
  font-size:1.6rem;
  font-weight:900;
  margin-bottom:6px;
  color:#fff;
  overflow-wrap:anywhere;
}

.track-channel {
  font-size:.95rem;
  color:var(--primary-color);
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}

.btn-download-special {

  border-radius:6px;

.btn-download-special.loading-dl {

.audio-player {

.progress-container {

}

.progress-bar {

.player-controls {

.transcript-line:hover,.transcript-line.active{background:rgba(2,132,199,.16);border-color:rgba(56,189,248,.5)}

.transcript-words{line-height:1.75;overflow-wrap:anywhere}

<script>
const SHEET_ID = "1rL5l72HK8KccymCdpfQE1eITLv-d-MNl0I-fIcpNgPA";
const SHEET_NAME = "Player";

const playersList = document.getElementById("playersList");
if (window.self !== window.top) document.body.classList.add("is-embedded");

function getCell(row,index) {
  const cell = row.c?.[index];
  return cell?.v ?? cell?.f ?? "";
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return min + ":" + String(sec).padStart(2,"0");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function parseTranslation(value) {
  if (!value) return {lines:[], plain:""};

  try {
    const parsed = JSON.parse(value);

    if (Array.isArray(parsed)) {
      const lines = parsed.map(item => ({
        start:Number(item.start),
        end:Number(item.end),
        text:String(item.text || "")
      })).filter(item =>
        Number.isFinite(item.start) &&
        Number.isFinite(item.end) &&
        item.end > item.start &&
        item.text.trim()
      ).sort((a,b) => a.start - b.start);

      return {lines,plain:""};
    }
  } catch(error) {
    // النص العادي يعرض عند فتح الترجمة
  }

  return {lines:[],plain:String(value)};
}

function parseVtt(vtt) {
  const blocks = String(vtt).replace(/\\r/g, "").split(/\\n\\s*\\n/);
  const toSeconds = value => {
    const parts = value.trim().replace(",", ".").split(":").map(Number);
    if (parts.some(Number.isNaN)) return NaN;
    return parts.reduce((total, part) => total * 60 + part, 0);
  };
  return blocks.map(block => {
    const lines = block.split("\\n");
    const timing = lines.find(line => line.includes("-->"));
    if (!timing) return null;
    const [start, end] = timing.split("-->").map(part => toSeconds(part.trim().split(/\\s+/)[0]));
    const text = lines.slice(lines.indexOf(timing) + 1).join(" ").replace(/<[^>]*>/g, "").trim();
    return { start, end, text };
  }).filter(item => item && Number.isFinite(item.start) && Number.isFinite(item.end) && item.end > item.start && item.text);
}

function createPlayer(record) {
  const card = document.createElement("section");
  card.className = "page-container";

  const safeTitle = escapeHTML(record.name || "شارة صوتية");
  const safeChannel = escapeHTML(record.channel || "");
  const safeImage = escapeHTML(record.image || "");

  card.innerHTML = `
    <div class="top-meta-bar">
      <div class="meta-container">
        <div class="poster-container">
          <img src="${safeImage}" alt="بوستر المسلسل"

        </div>

        <div class="track-info">
          <h2 class="track-title">${safeTitle}</h2>
          <div class="track-channel">
            <i class="fa-solid fa-tv"></i>
            <span>${safeChannel}</span>
          </div>
        </div>
      </div>

      <button class="control-btn btn-download-special downloadBtn"
              title="تحميل الشارة">
        <i class="fa-solid fa-cloud-arrow-down"></i>
      </button>
    </div>

    <audio preload="metadata"></audio>

    <div class="audio-player">
      <div class="progress-container">
        <div class="timeline">
          <div class="progress-bar"></div>
        </div>

        <div class="time-stamps">
          <span class="currentTime">0:00</span>
          <span class="duration">0:00</span>
        </div>
      </div>

      <div class="player-controls">
        <div class="speed-wrapper">
          <button class="control-btn btn-speed">1.0x</button>
          <div class="speed-menu">
            <button class="speed-option" data-speed="0.5">0.5x</button>
            <button class="speed-option" data-speed="0.75">0.75x</button>
            <button class="speed-option selected" data-speed="1">1.0x</button>
            <button class="speed-option" data-speed="1.25">1.25x</button>
            <button class="speed-option" data-speed="1.5">1.5x</button>
            <button class="speed-option" data-speed="2">2.0x</button>
          </div>
        </div>

        <div class="center-playback-group">
          <button class="control-btn btn-skip rewindBtn"
                  title="تأخير 10 ثوانٍ">
            <i class="fa-solid fa-forward-fast"></i>
          </button>

          <button class="control-btn btn-play-pause">
            <i class="fa-solid fa-play"></i>
          </button>

          <button class="control-btn btn-skip forwardBtn"
                  title="تقديم 10 ثوانٍ">
            <i class="fa-solid fa-backward-fast"></i>
          </button>
        </div>

        <button class="control-btn btn-loop" title="تكرار تلقائي">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>

    <div class="player-extra-actions">
      <button class="translation-toggle" type="button" aria-pressed="false">
      <i class="fa-solid fa-closed-captioning"></i>
      إظهار الترجمة المتزامنة
    </button>
      <button class="transcript-toggle" type="button" aria-pressed="false">
        <i class="fa-solid fa-list"></i> عرض النص والتوقيت
      </button>
      <button class="embed-toggle" type="button"><i class="fa-solid fa-code"></i> نسخ كود التضمين</button>
    </div>

    <section class="translation-area">
      <div class="translation-text empty">
        اضغط تشغيل لعرض الترجمة المتزامنة
      </div>

      <div class="translation-tools">
        <button class="smaller">A−</button>
        <button class="larger">A+</button>
        <button class="fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </section>
  `;

  playersList.appendChild(card);

  const audio = card.querySelector("audio");
  const playButton = card.querySelector(".btn-play-pause");
  const playIcon = playButton.querySelector("i");
  const timeline = card.querySelector(".timeline");
  const progressBar = card.querySelector(".progress-bar");
  const currentLabel = card.querySelector(".currentTime");
  const durationLabel = card.querySelector(".duration");
  const speedButton = card.querySelector(".btn-speed");
  const speedMenu = card.querySelector(".speed-menu");
  const loopButton = card.querySelector(".btn-loop");
  const downloadButton = card.querySelector(".downloadBtn");

  const embedButton = card.querySelector("button.embed-toggle");
  // واجهة التضمين لا تظهر للزوار العاديين؛ افتح لوحة النسخ بإضافة ?admin=1.
  const isEmbedAdmin = new URLSearchParams(location.search).get("admin") === "1";
  embedButton.hidden = !isEmbedAdmin;
  embedButton.addEventListener("click", async () => {
    const embedUrl = new URL("Player.html", location.href);
    embedUrl.searchParams.set("id", String(record.id));
    const title = String(record.name || "مشغل الشارة").replace(/["<>]/g, "");
    const snippet = '<iframe src="' + embedUrl.href + '" title="' + title +
      '" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen ' +
      'webkitallowfullscreen mozallowfullscreen ' +
      'style="display:block;width:100%;max-width:100%;height:clamp(500px,72vw,680px);min-height:460px;border:0;border-radius:18px;overflow:hidden"></iframe>';
    try {
      await navigator.clipboard.writeText(snippet);
      embedButton.innerHTML = '<i class="fa-solid fa-check"></i> تم نسخ التضمين';
      setTimeout(() => embedButton.innerHTML = '<i class="fa-solid fa-code"></i> نسخ كود التضمين', 2000);
    } catch {
      window.prompt("انسخ كود التضمين:", snippet);
    }
  });

  const translationButton = card.querySelector(".translation-toggle");
  const transcriptButton = card.querySelector(".transcript-toggle");
  const translationArea = card.querySelector(".translation-area");
  const translationText = card.querySelector(".translation-text");

  const translation = parseTranslation(record.translation);
  let captionsEnabled = false;
  let transcriptEnabled = false;
  let fontSize = 24;
  let lastRenderedLine = -1;

  function updateTranslationPanel() {
    translationArea.classList.toggle("visible", captionsEnabled || transcriptEnabled);
    translationText.style.display = captionsEnabled ? "block" : "none";
    const list = translationArea.querySelector(".transcript-list");
    if (list) list.classList.toggle("visible", transcriptEnabled);
    translationButton.classList.toggle("active", captionsEnabled);
    transcriptButton.classList.toggle("active", transcriptEnabled);
    translationButton.setAttribute("aria-pressed", String(captionsEnabled));
    transcriptButton.setAttribute("aria-pressed", String(transcriptEnabled));
    translationButton.innerHTML = captionsEnabled
      ? '<i class="fa-solid fa-closed-captioning"></i> إيقاف الترجمة المتزامنة'
      : '<i class="fa-solid fa-closed-captioning"></i> إظهار الترجمة المتزامنة';
    transcriptButton.innerHTML = transcriptEnabled
      ? '<i class="fa-solid fa-list"></i> إخفاء النص والتوقيت'
      : '<i class="fa-solid fa-list"></i> عرض النص والتوقيت';
  }

  function renderKaraokeLine(line, current) {
    const words = line.text.trim().split(/\s+/).filter(Boolean);
    const duration = Math.max(0.001, line.end - line.start);
    const progress = Math.max(0, Math.min(0.999999, (current - line.start) / duration));
    const activeIndex = Math.min(words.length - 1, Math.floor(progress * words.length));
    translationText.replaceChildren();
    words.forEach((word, index) => {
      if (index) translationText.appendChild(document.createTextNode(" "));
      const span = document.createElement("span");
      span.className = "karaoke-word" + (index === activeIndex ? " active" : "");
      span.textContent = word;
      translationText.appendChild(span);
    });
    translationText.classList.remove("empty");
  }

  audio.src = record.audio;

  // التشغيل والإيقاف
  playButton.onclick = () => {
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  };

  audio.addEventListener("play", () => {
    playIcon.className = "fa-solid fa-pause";
  });

  audio.addEventListener("pause", () => {
    playIcon.className = "fa-solid fa-play";
  });

  audio.addEventListener("loadedmetadata", () => {
    durationLabel.textContent = formatTime(audio.duration);
  });

  // مزامنة الترجمة مع الصوت
  audio.addEventListener("timeupdate", () => {
    const current = audio.currentTime;
    const duration = audio.duration || 0;

    progressBar.style.width =
      duration ? (current / duration * 100) + "%" : "0%";

    currentLabel.textContent = formatTime(current);

    if (!captionsEnabled && !transcriptEnabled) return;

    if (!translation.lines.length) {
      if (captionsEnabled && translation.plain.trim()) {
        translationText.textContent = translation.plain;
        translationText.classList.remove("empty");
      }
      return;
    }

    if (translation.lines.length) {
      const lineIndex = translation.lines.findIndex(item =>
        current >= item.start && current < item.end
      );
      const line = lineIndex >= 0 ? translation.lines[lineIndex] : null;

      if (captionsEnabled) {
        if (line) {
          renderKaraokeLine(line, current);
          lastRenderedLine = lineIndex;
        } else {
          translationText.textContent = "";
          translationText.classList.add("empty");
          lastRenderedLine = -1;
        }
      }

      if (transcriptEnabled) {
        const transcriptRows = translationArea.querySelectorAll(".transcript-line");
        transcriptRows.forEach((row, index) => {
          row.classList.toggle("active", index === lineIndex);
        });
        const activeRow = lineIndex >= 0 ? transcriptRows[lineIndex] : null;
        if (activeRow) activeRow.scrollIntoView({block:"nearest",behavior:"smooth"});
      }
    }
  });

  // التقديم والتأخير
  card.querySelector(".forwardBtn").onclick = () => {
    audio.currentTime = Math.min(
      audio.duration || 0,
      audio.currentTime + 10
    );
  };

  card.querySelector(".rewindBtn").onclick = () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  };

  // تحريك شريط الصوت
  function seek(event) {
    if (!audio.duration) return;

    const rect = timeline.getBoundingClientRect();
    const ratio = (rect.right - event.clientX) / rect.width;

    audio.currentTime =
      Math.max(0, Math.min(1, ratio)) * audio.duration;
  }

  timeline.addEventListener("click",seek);

  // التكرار
  loopButton.onclick = () => {
    audio.loop = !audio.loop;
    loopButton.classList.toggle("active-loop",audio.loop);
  };

  // السرعة
  speedButton.onclick = event => {
    event.stopPropagation();
    speedMenu.style.display =
      speedMenu.style.display === "flex" ? "none" : "flex";
  };

  speedMenu.querySelectorAll(".speed-option").forEach(option => {
    option.onclick = () => {
      const speed = Number(option.dataset.speed);

      audio.playbackRate = speed;
      speedButton.textContent = speed + "x";
      speedButton.classList.toggle("active-speed",speed !== 1);

      speedMenu.querySelectorAll(".speed-option")
        .forEach(item => item.classList.remove("selected"));

      option.classList.add("selected");
      speedMenu.style.display = "none";
    };
  });

  // إنشاء قائمة النص والتوقيت مرة واحدة، بشكل مستقل عن الترجمة المتزامنة
  function buildTranscriptList() {
    let list = translationArea.querySelector(".transcript-list");
    if (list) return list;
    list = document.createElement("div");
    list.className = "transcript-list";
    translationArea.appendChild(list);

    if (translation.lines.length) {
      translation.lines.forEach(line => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "transcript-line";
        const stamp = document.createElement("span");
        stamp.className = "transcript-time";
        stamp.textContent = formatTime(line.start);
        const words = document.createElement("span");
        words.className = "transcript-words";
        words.textContent = line.text;
        item.append(stamp, words);
        item.addEventListener("click", () => {
          audio.currentTime = line.start;
          audio.play().catch(() => {});
        });
        list.appendChild(item);
      });
    } else {
      const message = document.createElement("div");
      message.className = "transcript-empty";
      message.textContent = translation.plain.trim()
        ? "هذه الترجمة نص متصل ولا تحتوي على توقيتات للمزامنة."
        : "لا توجد ترجمة محفوظة لهذه الشارة بعد.";
      list.appendChild(message);
    }
    return list;
  }

  translationButton.onclick = () => {
    captionsEnabled = !captionsEnabled;
    updateTranslationPanel();
    if (captionsEnabled) audio.dispatchEvent(new Event("timeupdate"));
  };

  transcriptButton.onclick = () => {
    transcriptEnabled = !transcriptEnabled;
    if (transcriptEnabled) buildTranscriptList();
    updateTranslationPanel();
    if (transcriptEnabled) audio.dispatchEvent(new Event("timeupdate"));
  };

  // تكبير وتصغير
  card.querySelector(".larger").onclick = () => {
    fontSize = Math.min(48,fontSize + 2);
    translationText.style.fontSize = fontSize + "px";
  };

  card.querySelector(".smaller").onclick = () => {
    fontSize = Math.max(14,fontSize - 2);
    translationText.style.fontSize = fontSize + "px";
  };

  // تكبير المشغل كاملًا داخل الصفحة أو في ملء الشاشة الحقيقي داخل التضمين
  const fullscreenButton = card.querySelector(".fullscreen");
  function setExpandedState(expanded) {
    card.classList.toggle("player-expanded", expanded);
    document.body.classList.toggle("player-expanded-lock", expanded);
    const icon = fullscreenButton.querySelector("i");
    if (icon) icon.className = expanded ? "fa-solid fa-compress" : "fa-solid fa-expand";
    fullscreenButton.setAttribute("aria-label", expanded ? "تصغير المشغل" : "تكبير المشغل");
    fullscreenButton.title = expanded ? "تصغير المشغل" : "تكبير المشغل";
  }

  fullscreenButton.onclick = async () => {
    try {
      if (document.fullscreenElement === card) {
        await document.exitFullscreen();
        return;
      }
      if (card.classList.contains("player-expanded")) {
        setExpandedState(false);
        return;
      }
      if (document.fullscreenElement) await document.exitFullscreen();
      if (card.requestFullscreen) {
        await card.requestFullscreen();
      } else {
        setExpandedState(true);
      }
    } catch(error) {
      // إذا منع المتصفح ملء الشاشة داخل iframe، استخدم وضع تكبير احتياطي داخل الإطار.
      console.warn("Fullscreen permission unavailable; using expanded player mode.", error);
      setExpandedState(true);
    }
  };

  document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement !== card) setExpandedState(false);
    else setExpandedState(true);
  });

  // التحميل
  downloadButton.onclick = async () => {
    const icon = downloadButton.querySelector("i");

    try {
      downloadButton.classList.add("loading-dl");
      icon.className = "fa-solid fa-spinner fa-spin";

      const response = await fetch(record.audio);
      if (!response.ok) throw new Error("Download failed");

      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = blobUrl;
      link.download = (record.name || "audio") + ".mp3";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(blobUrl),1000);

    } catch(error) {
      window.open(record.audio,"_blank");
    } finally {
      downloadButton.classList.remove("loading-dl");
      icon.className = "fa-solid fa-cloud-arrow-down";
    }
  };

  // اختصارات لوحة المفاتيح
  card.addEventListener("keydown",event => {
    if (event.target.tagName === "BUTTON") return;

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      audio.currentTime = Math.min(
        audio.duration || 0,
        audio.currentTime + 10
      );
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      audio.currentTime = Math.max(0,audio.currentTime - 10);
    } else if (event.code === "Space") {
      event.preventDefault();
      if (audio.paused) audio.play();
      else audio.pause();
    }
  });
}

async function loadAllPlayers() {
  try {
    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:json&headers=0&sheet=" +
      encodeURIComponent(SHEET_NAME);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("تعذر الوصول إلى Google Sheets");
    }

    const raw = await response.text();
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");

    if (start < 0 || end < 0) {
      throw new Error("استجابة غير صحيحة");
    }

    const data = JSON.parse(raw.slice(start,end + 1));
    const rows = data.table.rows || [];

    const records = rows.map(row => ({
      id:getCell(row,0),
      image:getCell(row,1),
      name:getCell(row,2),
      channel:getCell(row,3),
      audio:getCell(row,4),
      translation:getCell(row,5)
    })).filter(item =>
      String(item.id).trim() !== "" &&
      String(item.name).trim() !== "" &&
      String(item.audio).trim() !== ""
    );

    const requestedId = new URLSearchParams(location.search).get("id");
    const visibleRecords = requestedId
      ? records.filter(item => String(item.id).trim() === requestedId.trim())
      : records;

    playersList.innerHTML = "";

    if (!visibleRecords.length) {
      playersList.innerHTML =
        '<div class="page-status">لا توجد شارات مكتملة في ورقة Player.</div>';
      return;
    }

    visibleRecords.forEach(record => createPlayer(record));

  } catch(error) {
    console.error("Player loading error:",error);

    playersList.innerHTML =
      '<div class="page-status">تعذر تحميل البيانات من Google Sheets. تأكد من إتاحة الجدول للعرض العام واسم الورقة Player.</div>';
  }
}

loadAllPlayers();
</script>
