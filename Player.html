<style>

body {

.track-info {

.track-title {

}

.track-channel {

.btn-download-special {

  height:40px;
  border-radius:6px;
  background:#10b981;
  color:#fff;

  border:1px solid #047857;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.btn-download-special.loading-dl {

}

.audio-player {
  background:var(--player-bg);
  border-radius:18px;

  border:1px solid rgba(255,255,255,.03);

}

.progress-container {
  width:100%;

}

.timeline {
  width:100%;
  height:6px;
  background:#334155;
  border-radius:10px;
  cursor:pointer;
  position:relative;
}

.timeline:hover {
  height:8px;
}

.progress-bar {
  height:100%;

  background:linear-gradient(270deg,var(--primary-color),#0ea5e9);
  border-radius:10px;
}

.time-stamps {
  display:flex;
  justify-content:space-between;
  font-size:.85rem;
  color:var(--text-muted);

  direction:ltr;
}

.player-controls {

.control-btn {

.speed-wrapper {

.btn-speed.active-speed {

}

.center-playback-group {

}

.btn-skip {
  font-size:1.35rem;
  color:var(--text-muted);
  width:38px;
  height:38px;

}

.btn-skip:hover {

}

.btn-play-pause {
  width:52px;

  border-radius:50%;

}

.btn-loop {

.speed-menu {

  bottom:45px;
  right:0;
  background:#1e293b;
  border:1px solid #334155;

}

.speed-option {
  background:none;
  border:none;
  color:var(--text-color);
  padding:6px 14px;

  border-radius:6px;

  width:65px;
}

.speed-option:hover {
  background:var(--primary-color);
  color:#fff;
}

.speed-option.selected {
  background:rgba(2,132,199,.2);
  color:#38bdf8;
}

/* الترجمة مخفية افتراضياً */

.translation-toggle {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:#cbd5e1;
  font-size:1rem;
  cursor:pointer;
}

.translation-toggle:hover {
  border-color:var(--primary-color);
  color:#38bdf8;
}

.player-extra-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.embed-toggle{flex:1;min-width:140px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#111c30;color:#cbd5e1;font:inherit;cursor:pointer}
.embed-toggle:hover{border-color:var(--primary-color);color:#38bdf8}
.transcribe-toggle{flex:1;min-width:140px;padding:12px;border-radius:10px;border:1px solid rgba(14,165,233,.25);background:#10263c;color:#7dd3fc;font:inherit;cursor:pointer}.transcribe-toggle:disabled{opacity:.6;cursor:wait}
.translation-area {
  display:none;
  background:var(--player-bg);
  border-radius:16px;
  padding:18px 15px;
  border:1px solid rgba(255,255,255,.04);
  flex-direction:column;
  gap:15px;
}

.translation-area.visible {
  display:flex;
}

.translation-text {
  min-height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:24px;
  line-height:1.9;
  font-weight:700;
  color:#fff;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.translation-text.empty {
  color:var(--text-muted);
  font-size:15px;
  font-weight:500;
}

.translation-tools {
  display:flex;
  justify-content:center;
  gap:10px;
}

.translation-tools button {
  background:rgba(255,255,255,.06);
  color:var(--text-muted);
  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;
  padding:9px 14px;
  cursor:pointer;
}

.translation-area:fullscreen {
  background:#0b1220;
  min-height:100vh;
  justify-content:center;
  padding:30px;
}

.translation-area:fullscreen .translation-text {
  font-size:clamp(25px,5vw,48px);
}

.page-status {
  color:var(--text-muted);
  text-align:center;
  padding:35px 10px;
  font-size:15px;
}

@media(max-width:540px) {
  body {
    padding:12px;
  }

  .page-container {
    padding:20px;
    gap:18px;
  }

  .top-meta-bar {
    gap:12px;
  }

  .meta-container {
    gap:12px;
  }

  .poster-container {
    width:75px;
    height:75px;
  }

  .track-title {
    font-size:1.3rem;
  }

  .track-channel {
    font-size:.85rem;
  }

  .audio-player {
    padding:15px;
  }

  .center-playback-group {
    gap:12px;
  }
}
</style>

<body>

<main id="playersList">
  <div class="page-status">جاري تحميل الشارات...</div>
</main>

<script>
const SHEET_ID = "1rL5l72HK8KccymCdpfQE1eITLv-d-MNl0I-fIcpNgPA";
const SHEET_NAME = "Player";

const playersList = document.getElementById("playersList");

function getCell(row,index) {
  const cell = row.c?.[index];
  return cell?.v ?? cell?.f ?? "";
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return min + ":" + String(sec).padStart(2,"0");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function parseTranslation(value) {
  if (!value) return {lines:[], plain:""};

  try {
    const parsed = JSON.parse(value);

    if (Array.isArray(parsed)) {
      const lines = parsed.map(item => ({
        start:Number(item.start),
        end:Number(item.end),
        text:String(item.text || "")
      })).filter(item =>
        Number.isFinite(item.start) &&
        Number.isFinite(item.end) &&
        item.end > item.start &&
        item.text.trim()
      ).sort((a,b) => a.start - b.start);

      return {lines,plain:""};
    }
  } catch(error) {
    // النص العادي يعرض عند فتح الترجمة
  }

  return {lines:[],plain:String(value)};
}

function parseVtt(vtt) {
  const blocks = String(vtt).replace(/\\r/g, "").split(/\\n\\s*\\n/);
  const toSeconds = value => {
    const parts = value.trim().replace(",", ".").split(":").map(Number);
    if (parts.some(Number.isNaN)) return NaN;
    return parts.reduce((total, part) => total * 60 + part, 0);
  };
  return blocks.map(block => {
    const lines = block.split("\\n");
    const timing = lines.find(line => line.includes("-->"));
    if (!timing) return null;
    const [start, end] = timing.split("-->").map(part => toSeconds(part.trim().split(/\\s+/)[0]));
    const text = lines.slice(lines.indexOf(timing) + 1).join(" ").replace(/<[^>]*>/g, "").trim();
    return { start, end, text };
  }).filter(item => item && Number.isFinite(item.start) && Number.isFinite(item.end) && item.end > item.start && item.text);
}

function createPlayer(record) {
  const card = document.createElement("section");
  card.className = "page-container";

  const safeTitle = escapeHTML(record.name || "شارة صوتية");
  const safeChannel = escapeHTML(record.channel || "");
  const safeImage = escapeHTML(record.image || "");

  card.innerHTML = `
    <div class="top-meta-bar">
      <div class="meta-container">
        <div class="poster-container">
          <img src="${safeImage}" alt="بوستر المسلسل"
               onerror="this.style.display='none'">
        </div>

        <div class="track-info">
          <h2 class="track-title">${safeTitle}</h2>
          <div class="track-channel">
            <i class="fa-solid fa-tv"></i>
            <span>${safeChannel}</span>
          </div>
        </div>
      </div>

      <button class="control-btn btn-download-special downloadBtn"
              title="تحميل الشارة">
        <i class="fa-solid fa-cloud-arrow-down"></i>
      </button>
    </div>

    <audio preload="metadata"></audio>

    <div class="audio-player">
      <div class="progress-container">
        <div class="timeline">
          <div class="progress-bar"></div>
        </div>

        <div class="time-stamps">
          <span class="currentTime">0:00</span>
          <span class="duration">0:00</span>
        </div>
      </div>

      <div class="player-controls">
        <div class="speed-wrapper">
          <button class="control-btn btn-speed">1.0x</button>
          <div class="speed-menu">
            <button class="speed-option" data-speed="0.5">0.5x</button>
            <button class="speed-option" data-speed="0.75">0.75x</button>
            <button class="speed-option selected" data-speed="1">1.0x</button>
            <button class="speed-option" data-speed="1.25">1.25x</button>
            <button class="speed-option" data-speed="1.5">1.5x</button>
            <button class="speed-option" data-speed="2">2.0x</button>
          </div>
        </div>

        <div class="center-playback-group">
          <button class="control-btn btn-skip rewindBtn"
                  title="تأخير 10 ثوانٍ">
            <i class="fa-solid fa-forward-fast"></i>
          </button>

          <button class="control-btn btn-play-pause">
            <i class="fa-solid fa-play"></i>
          </button>

          <button class="control-btn btn-skip forwardBtn"
                  title="تقديم 10 ثوانٍ">
            <i class="fa-solid fa-backward-fast"></i>
          </button>
        </div>

        <button class="control-btn btn-loop" title="تكرار تلقائي">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>

    <div class="player-extra-actions">
      <button class="translation-toggle">
      <i class="fa-solid fa-language"></i>
      إظهار الترجمة
    </button>
      <button class="embed-toggle" type="button"><i class="fa-solid fa-code"></i> نسخ كود التضمين</button>
      <button class="transcribe-toggle" type="button" hidden><i class="fa-solid fa-wand-magic-sparkles"></i> تفريغ صوت تجريبي</button>
    </div>

    <section class="translation-area">
      <div class="translation-text empty">
        اضغط تشغيل لعرض الترجمة المتزامنة
      </div>

      <div class="translation-tools">
        <button class="smaller">A−</button>
        <button class="larger">A+</button>
        <button class="fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </section>
  `;

  playersList.appendChild(card);

  const audio = card.querySelector("audio");
  const playButton = card.querySelector(".btn-play-pause");
  const playIcon = playButton.querySelector("i");
  const timeline = card.querySelector(".timeline");
  const progressBar = card.querySelector(".progress-bar");
  const currentLabel = card.querySelector(".currentTime");
  const durationLabel = card.querySelector(".duration");
  const speedButton = card.querySelector(".btn-speed");
  const speedMenu = card.querySelector(".speed-menu");
  const loopButton = card.querySelector(".btn-loop");
  const downloadButton = card.querySelector(".downloadBtn");

  const embedButton = card.querySelector(".embed-toggle");
  // واجهة التضمين لا تظهر للزوار العاديين؛ افتح لوحة النسخ بإضافة ?admin=1.
  const isEmbedAdmin = new URLSearchParams(location.search).get("admin") === "1";
  embedButton.hidden = !isEmbedAdmin;
  const transcribeButton = card.querySelector(".transcribe-toggle");
  transcribeButton.hidden = !isEmbedAdmin;
  transcribeButton.addEventListener("click", async () => {
    const original = transcribeButton.innerHTML;
    transcribeButton.disabled = true;
    transcribeButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ تفريغ الصوت...';
    try {
      const response = await fetch("https://majd-drama-ai.sultan2021alamoudi.workers.dev/player/transcribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ audioUrl: record.audio })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || "تعذر تفريغ الصوت");
      const timedLines = Array.isArray(result.segments) ? result.segments
        .map(item => ({
          start: Number(item.start),
          end: Number(item.end),
          text: String(item.text || "").trim()
        }))
        .filter(item => Number.isFinite(item.start) && Number.isFinite(item.end) && item.end > item.start && item.text)
        : [];
      if (timedLines.length) {
        translation.lines = timedLines;
        translation.plain = "";
      } else if (result.vtt) {
        translation.lines = parseVtt(result.vtt);
        translation.plain = result.text || "";
      } else {
        translation.plain = result.text || "";
      }
      translationArea.classList.add("visible");
      translationButton.innerHTML = '<i class="fa-solid fa-eye-slash"></i> إخفاء الترجمة';
      translationText.textContent = translation.lines.length
        ? "تم استخراج النص بالتوقيت. شغّل الصوت لمتابعة المقاطع."
        : (translation.plain || "لم يرجع النموذج نصًا.");
      translationText.classList.toggle("empty", !translation.lines.length && !translation.plain);
      transcribeButton.innerHTML = '<i class="fa-solid fa-check"></i> اكتمل التفريغ (غير محفوظ)';
    } catch (error) {
      transcribeButton.innerHTML = original;
      alert("تعذر التفريغ: " + error.message);
    } finally {
      transcribeButton.disabled = false;
    }
  });
  embedButton.addEventListener("click", async () => {
    const embedUrl = new URL("Player.html", location.href);
    embedUrl.searchParams.set("id", String(record.id));
    const title = String(record.name || "مشغل الشارة").replace(/["<>]/g, "");
    const snippet = '<iframe src="' + embedUrl.href + '" title="' + title +
      '" loading="lazy" allow="autoplay; fullscreen" allowfullscreen ' +
      'style="width:100%;height:560px;border:0;overflow:hidden"></iframe>';
    try {
      await navigator.clipboard.writeText(snippet);
      embedButton.innerHTML = '<i class="fa-solid fa-check"></i> تم نسخ التضمين';
      setTimeout(() => embedButton.innerHTML = '<i class="fa-solid fa-code"></i> نسخ كود التضمين', 2000);
    } catch {
      window.prompt("انسخ كود التضمين:", snippet);
    }
  });

  const translationButton = card.querySelector(".translation-toggle");
  const translationArea = card.querySelector(".translation-area");
  const translationText = card.querySelector(".translation-text");

  const translation = parseTranslation(record.translation);
  let fontSize = 24;

  audio.src = record.audio;

  // التشغيل والإيقاف
  playButton.onclick = () => {
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  };

  audio.addEventListener("play", () => {
    playIcon.className = "fa-solid fa-pause";
  });

  audio.addEventListener("pause", () => {
    playIcon.className = "fa-solid fa-play";
  });

  audio.addEventListener("loadedmetadata", () => {
    durationLabel.textContent = formatTime(audio.duration);
  });

  // مزامنة الترجمة مع الصوت
  audio.addEventListener("timeupdate", () => {
    const current = audio.currentTime;
    const duration = audio.duration || 0;

    progressBar.style.width =
      duration ? (current / duration * 100) + "%" : "0%";

    currentLabel.textContent = formatTime(current);

    if (!translationArea.classList.contains("visible")) return;

    if (translation.lines.length) {
      const line = translation.lines.find(item =>
        current >= item.start && current < item.end
      );

      if (line) {
        translationText.textContent = line.text;
        translationText.classList.remove("empty");
      } else {
        translationText.textContent = "";
        translationText.classList.add("empty");
      }
    }
  });

  // التقديم والتأخير
  card.querySelector(".forwardBtn").onclick = () => {
    audio.currentTime = Math.min(
      audio.duration || 0,
      audio.currentTime + 10
    );
  };

  card.querySelector(".rewindBtn").onclick = () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  };

  // تحريك شريط الصوت
  function seek(event) {
    if (!audio.duration) return;

    const rect = timeline.getBoundingClientRect();
    const ratio = (rect.right - event.clientX) / rect.width;

    audio.currentTime =
      Math.max(0, Math.min(1, ratio)) * audio.duration;
  }

  timeline.addEventListener("click",seek);

  // التكرار
  loopButton.onclick = () => {
    audio.loop = !audio.loop;
    loopButton.classList.toggle("active-loop",audio.loop);
  };

  // السرعة
  speedButton.onclick = event => {
    event.stopPropagation();
    speedMenu.style.display =
      speedMenu.style.display === "flex" ? "none" : "flex";
  };

  speedMenu.querySelectorAll(".speed-option").forEach(option => {
    option.onclick = () => {
      const speed = Number(option.dataset.speed);

      audio.playbackRate = speed;
      speedButton.textContent = speed + "x";
      speedButton.classList.toggle("active-speed",speed !== 1);

      speedMenu.querySelectorAll(".speed-option")
        .forEach(item => item.classList.remove("selected"));

      option.classList.add("selected");
      speedMenu.style.display = "none";
    };
  });

  // إظهار وإخفاء الترجمة
  translationButton.onclick = () => {
    const visible = translationArea.classList.toggle("visible");

    translationButton.innerHTML = visible
      ? '<i class="fa-solid fa-eye-slash"></i> إخفاء الترجمة'
      : '<i class="fa-solid fa-language"></i> إظهار الترجمة';

    if (visible && !translation.lines.length) {
      if (translation.plain.trim()) {
        translationText.textContent = translation.plain;
        translationText.classList.remove("empty");
      } else {
        translationText.textContent = "لا توجد ترجمة محفوظة لهذه الشارة بعد";
        translationText.classList.add("empty");
      }
    }
  };

  // تكبير وتصغير
  card.querySelector(".larger").onclick = () => {
    fontSize = Math.min(48,fontSize + 2);
    translationText.style.fontSize = fontSize + "px";
  };

  card.querySelector(".smaller").onclick = () => {
    fontSize = Math.max(14,fontSize - 2);
    translationText.style.fontSize = fontSize + "px";
  };

  // ملء الشاشة
  card.querySelector(".fullscreen").onclick = async () => {
    try {
      if (!document.fullscreenElement) {
        await translationArea.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch(error) {
      console.error(error);
    }
  };

  // التحميل
  downloadButton.onclick = async () => {
    const icon = downloadButton.querySelector("i");

    try {
      downloadButton.classList.add("loading-dl");
      icon.className = "fa-solid fa-spinner fa-spin";

      const response = await fetch(record.audio);
      if (!response.ok) throw new Error("Download failed");

      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = blobUrl;
      link.download = (record.name || "audio") + ".mp3";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(blobUrl),1000);

    } catch(error) {
      window.open(record.audio,"_blank");
    } finally {
      downloadButton.classList.remove("loading-dl");
      icon.className = "fa-solid fa-cloud-arrow-down";
    }
  };

  // اختصارات لوحة المفاتيح
  card.addEventListener("keydown",event => {
    if (event.target.tagName === "BUTTON") return;

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      audio.currentTime = Math.min(
        audio.duration || 0,
        audio.currentTime + 10
      );
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      audio.currentTime = Math.max(0,audio.currentTime - 10);
    } else if (event.code === "Space") {
      event.preventDefault();
      if (audio.paused) audio.play();
      else audio.pause();
    }
  });
}

async function loadAllPlayers() {
  try {
    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:json&headers=0&sheet=" +
      encodeURIComponent(SHEET_NAME);

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("تعذر الوصول إلى Google Sheets");
    }

    const raw = await response.text();
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");

    if (start < 0 || end < 0) {
      throw new Error("استجابة غير صحيحة");
    }

    const data = JSON.parse(raw.slice(start,end + 1));
    const rows = data.table.rows || [];

    const records = rows.map(row => ({
      id:getCell(row,0),
      image:getCell(row,1),
      name:getCell(row,2),
      channel:getCell(row,3),
      audio:getCell(row,4),
      translation:getCell(row,5)
    })).filter(item =>
      String(item.id).trim() !== "" &&
      String(item.name).trim() !== "" &&
      String(item.audio).trim() !== ""
    );

    const requestedId = new URLSearchParams(location.search).get("id");
    const visibleRecords = requestedId
      ? records.filter(item => String(item.id).trim() === requestedId.trim())
      : records;

    playersList.innerHTML = "";

    if (!visibleRecords.length) {
      playersList.innerHTML =
        '<div class="page-status">لا توجد شارات مكتملة في ورقة Player.</div>';
      return;
    }

    visibleRecords.forEach(record => createPlayer(record));

  } catch(error) {
    console.error("Player loading error:",error);

    playersList.innerHTML =
      '<div class="page-status">تعذر تحميل البيانات من Google Sheets. تأكد من إتاحة الجدول للعرض العام واسم الورقة Player.</div>';
  }
}

loadAllPlayers();
</script>
