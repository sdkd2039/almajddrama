<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل صوتي - دراما المجد</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-color:#0f172a;
  --card-bg:#1e293b;
  --text-color:#f8fafc;
  --primary-color:#0284c7;
  --primary-hover:#0369a1;
  --text-muted:#94a3b8;
  --accent-gold:#ffd700;
  --player-bg:#151f32;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Tajawal',sans-serif;
}

html { width:100%; min-height:100%; }
body {
  background:var(--bg-color);
  color:var(--text-color);
  min-height:100vh;
  padding:clamp(10px,2.2vw,28px);
  overflow-x:hidden;
}
body.is-embedded {
  padding:0;
  background:transparent;
}
body.is-embedded #playersList {
  padding:0;
  gap:0;
}
body.is-embedded .page-container,
body.is-standalone-player .page-container {
  max-width:none;
  width:100%;
  min-height:0;
  margin:0;
  border-radius:clamp(12px,2vw,22px);
  box-shadow:none;
}
body.is-standalone-player {
  min-height:100svh;
  padding:clamp(10px,2vw,22px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
body.is-standalone-player #playersList {
  max-width:900px;
  width:100%;
}
body.is-standalone-player .page-container {
  max-width:900px;
  padding:clamp(16px,3vw,30px);
}
body.is-standalone-player .top-meta-bar {
  gap:16px;
}

#playersList {
  width:100%;
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  align-items:start;
  gap:clamp(14px,2vw,24px);
}
#playersList:has(.page-container:nth-child(2)) {
  grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));
}

.page-container[hidden]{display:none !important}
.page-container {
  width:100%;
  min-width:0;
  max-width:760px;
  justify-self:center;
  background:var(--card-bg);
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  padding:25px 30px;
  display:flex;
  flex-direction:column;
  gap:22px;
  border:1px solid rgba(255,255,255,.05);
}

.top-meta-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  gap:20px;
}

.meta-container {
  display:flex;
  align-items:center;
  gap:20px;
  text-align:right;
  min-width:0;
}

.poster-container {
  width:90px;
  height:90px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
  overflow:hidden;
  border:2px solid rgba(255,255,255,.1);
  flex-shrink:0;
}

.poster-container img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.track-info {
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.track-title {
  font-size:1.6rem;
  font-weight:900;
  margin-bottom:6px;
  color:#fff;
  overflow-wrap:anywhere;
}

.track-channel {
  font-size:.95rem;
  color:var(--primary-color);
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}

.btn-download-special {
  padding:8px 18px;
  height:40px;
  border-radius:6px;
  background:#10b981;
  color:#fff;
  font-size:1.15rem;
  border:1px solid #047857;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.btn-download-special.loading-dl {
  background:#d97706;
}

.audio-player {
  background:var(--player-bg);
  border-radius:18px;
  padding:20px;
  border:1px solid rgba(255,255,255,.03);
  width:100%;
}

.progress-container {
  width:100%;
  margin-bottom:15px;
}

.timeline {
  width:100%;
  height:6px;
  background:#334155;
  border-radius:10px;
  cursor:pointer;
  position:relative;
}

.timeline:hover {
  height:8px;
}

.progress-bar {
  height:100%;
  width:0%;
  background:linear-gradient(270deg,var(--primary-color),#0ea5e9);
  border-radius:10px;
}

.time-stamps {
  display:flex;
  justify-content:space-between;
  font-size:.85rem;
  color:var(--text-muted);
  margin-top:8px;
  direction:rtl;
}

.time-stamps span {
  direction:ltr;
}

.player-controls {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
}

.control-btn {
  background:none;
  border:none;
  color:var(--text-color);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.speed-wrapper {
  position:relative;
}

.btn-speed {
  font-size:.85rem;
  font-weight:700;
  background:rgba(255,255,255,.06);
  padding:8px 14px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.05);
  color:var(--text-muted);
  width:60px;
}

.btn-speed.active-speed {
  color:var(--accent-gold);
  background:rgba(255,215,0,.1);
}

.center-playback-group {
  display:flex;
  align-items:center;
  gap:20px;
}

.btn-skip {
  font-size:1.35rem;
  color:var(--text-muted);
  width:38px;
  height:38px;
  border-radius:50%;
}

.btn-skip:hover {
  color:#fff;
  background:rgba(255,255,255,.05);
}

.btn-play-pause {
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--primary-color);
  color:#fff;
  font-size:1.25rem;
}

.btn-loop {
  width:38px;
  height:38px;
  font-size:1.1rem;
  background:rgba(255,255,255,.06);
  border-radius:8px;
  border:1px solid rgba(255,255,255,.05);
  color:var(--text-muted);
}

.btn-loop.active-loop {
  color:#0ea5e9;
  background:rgba(14,165,233,.1);
}

.speed-menu {
  display:none;
  position:absolute;
  bottom:45px;
  right:0;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:12px;
  padding:5px;
  z-index:10;
  flex-direction:column;
  gap:2px;
}

.speed-option {
  background:none;
  border:none;
  color:var(--text-color);
  padding:6px 14px;
  font-size:.85rem;
  font-weight:700;
  border-radius:6px;
  cursor:pointer;
  width:65px;
}

.speed-option:hover {
  background:var(--primary-color);
  color:#fff;
}

.speed-option.selected {
  background:rgba(2,132,199,.2);
  color:#38bdf8;
}

/* الترجمة مخفية افتراضياً */

.translation-toggle {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  color:#cbd5e1;
  font-size:1rem;
  cursor:pointer;
}

.translation-toggle:hover {
  border-color:var(--primary-color);
  color:#38bdf8;
}

.player-extra-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:4px}
.player-extra-actions button{min-width:0;min-height:48px;line-height:1.45;white-space:normal}
.player-extra-actions .embed-toggle[hidden]{display:none}
.player-extra-actions:has(.embed-toggle[hidden]){grid-template-columns:repeat(2,minmax(0,1fr))}
.player-extra-actions:has(.translation-toggle:only-child){grid-template-columns:1fr}
.player-extra-actions .translation-toggle{grid-column:1/-1}
.embed-toggle{flex:1;min-width:140px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#111c30;color:#cbd5e1;font:inherit;cursor:pointer}
.embed-toggle:hover{border-color:var(--primary-color);color:#38bdf8}
.transcript-toggle{flex:1;min-width:140px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#111c30;color:#cbd5e1;font:inherit;cursor:pointer}
.transcript-toggle:hover{border-color:var(--primary-color);color:#38bdf8}
.transcript-toggle.active{border-color:rgba(56,189,248,.55);color:#38bdf8;background:rgba(2,132,199,.14)}
.translation-area {
  display:none;
  width:100%;
  min-width:0;
  background:var(--player-bg);
  border-radius:16px;
  padding:18px 15px;
  border:1px solid rgba(255,255,255,.04);
  flex-direction:column;
  gap:15px;
}

.translation-area.visible {
  display:flex;
}

.transcript-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:2px;overscroll-behavior:contain}
.transcript-line{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:start;gap:12px;width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.035);color:#e2e8f0;text-align:right;font:inherit;cursor:pointer;transition:background .18s,border-color .18s}
.transcript-line:hover,.transcript-line.active{background:rgba(2,132,199,.16);border-color:rgba(56,189,248,.5)}
.transcript-time{direction:ltr;text-align:center;color:#38bdf8;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.transcript-words{line-height:1.75;overflow-wrap:anywhere}
.transcript-empty{padding:12px;color:var(--text-muted);text-align:center;font-size:.9rem}
button:focus-visible,.timeline:focus-visible{outline:2px solid #38bdf8;outline-offset:3px}

.translation-text {
  min-height:clamp(92px,14vw,150px);
  display:block;
  align-content:center;
  justify-content:center;
  width:100%;
  max-width:100%;
  direction:rtl;
  unicode-bidi:plaintext;
  text-align:center;
  font-size:24px;
  line-height:1.9;
  font-weight:700;
  color:#fff;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.translation-text.empty {
  color:var(--text-muted);
  font-size:15px;
  font-weight:500;
}

/* تمييز الكلمات كلمةً كلمة من اليمين إلى اليسار */
.karaoke-sweep{
  display:inline;
  direction:rtl;
  unicode-bidi:isolate;
  white-space:pre-wrap;
  word-spacing:normal;
  letter-spacing:normal;
}
.karaoke-word{
  display:inline;
  white-space:pre;
  color:transparent;
  background:linear-gradient(to left,#fb5b24 0%,#fb5b24 var(--word-progress,0%),#fff var(--word-progress,0%),#fff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  /* توسيع مساحة الخلفية عموديًا حتى تشمل نقاط الحروف والهمزات (ش، ث، إ...) */
  padding-block:.45em;
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone;
  filter:drop-shadow(0 0 4px rgba(251,91,36,.10));
}
.karaoke-word.done{--word-progress:100%}
.translation-area:fullscreen .karaoke-word,
.translation-area.translation-focus .karaoke-word{
  background-image:linear-gradient(to left,#fbbf24 0%,#fbbf24 var(--word-progress,0%),#dbeafe var(--word-progress,0%),#dbeafe 100%);
  -webkit-background-clip:text;background-clip:text;
}
.transcript-list {display:none}
.transcript-list.visible {display:flex}
.transcript-toggle.active {
  border-color:rgba(56,189,248,.55);
  color:#38bdf8;
  background:rgba(2,132,199,.14);
}

.translation-tools {
  display:flex;
  justify-content:center;
  gap:10px;
}

.translation-tools button {
  background:rgba(255,255,255,.06);
  color:var(--text-muted);
  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;
  padding:9px 14px;
  cursor:pointer;
}

/* تجربة عرض الترجمة بكامل الشاشة: مساحة قراءة + خلفية حية + مشغل ثابت */
.translation-area:fullscreen,
.translation-area.translation-focus {
  position:fixed;
  inset:0;
  z-index:2147483000;
  width:100vw;
  height:100vh;
  height:100dvh;
  max-height:none;
  min-height:0;
  margin:0;
  padding:clamp(14px,3vw,34px);
  border:0;
  border-radius:0;
  overflow:hidden;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto auto;
  align-items:stretch;
  gap:clamp(12px,2vh,22px);
  isolation:isolate;
  background:
    radial-gradient(ellipse at 15% 18%,rgba(8,145,178,.19),transparent 44%),
    radial-gradient(ellipse at 88% 82%,rgba(124,58,237,.20),transparent 42%),
    linear-gradient(145deg,#071426,#101a35 48%,#101629);
  box-shadow:none;
}
.translation-area.translation-focus::before,
.translation-area:fullscreen::before {
  content:"";
  position:absolute;
  inset:-35%;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 28% 30%,rgba(14,165,233,.22),transparent 27%),
    radial-gradient(circle at 70% 68%,rgba(168,85,247,.18),transparent 30%),
    radial-gradient(circle at 50% 50%,rgba(20,184,166,.10),transparent 42%);
  filter:blur(28px);
  animation:translationAura 18s ease-in-out infinite alternate;
}
@keyframes translationAura {
  0% { transform:translate3d(-4%,-2%,0) rotate(0deg) scale(1); }
  50% { transform:translate3d(3%,4%,0) rotate(9deg) scale(1.08); }
  100% { transform:translate3d(-2%,2%,0) rotate(-7deg) scale(1.03); }
}
.page-container.translation-focus-card .top-meta-bar,
.page-container.translation-focus-card .player-extra-actions {
  display:none !important;
}
.translation-area:fullscreen .translation-text,
.translation-area.translation-focus .translation-text {
  grid-row:1;
  align-self:center;
  justify-self:center;
  width:min(100%,1200px);
  min-height:0;
  max-height:100%;
  padding:clamp(12px,3vw,38px);
  margin:0 auto;
  display:block;
  align-content:center;
  text-align:center;
  font-size:clamp(28px,5vw,62px);
  line-height:1.9;
  overflow-wrap:normal;
  word-break:normal;
  text-wrap:balance;
  border:1px solid rgba(148,163,184,.14);
  border-radius:clamp(18px,3vw,34px);
  background:linear-gradient(145deg,rgba(20,34,58,.68),rgba(10,21,40,.56));
  box-shadow:0 24px 80px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(14px);
}
.translation-area:fullscreen .karaoke-sweep,
.translation-area.translation-focus .karaoke-sweep{
  background:linear-gradient(to left,#fbbf24 0%,#fbbf24 var(--karaoke-progress,0%),#dbeafe var(--karaoke-progress,0%),#dbeafe 100%);
  -webkit-background-clip:text;background-clip:text;
}
.translation-area:fullscreen .transcript-list,
.translation-area.translation-focus .transcript-list {
  grid-row:2;
  width:min(100%,1000px);
  max-height:min(26vh,220px);
  margin:0 auto;
  overflow-y:auto;
  background:rgba(9,20,38,.55);
  border:1px solid rgba(148,163,184,.14);
  border-radius:16px;
  padding:8px;
  backdrop-filter:blur(12px);
}
.translation-area:fullscreen .audio-player,
.translation-area.translation-focus .audio-player {
  grid-row:3;
  width:min(100%,900px);
  max-width:900px;
  margin:0 auto;
  padding:clamp(10px,1.7vw,16px);
  border:1px solid rgba(148,163,184,.17);
  border-radius:18px;
  background:rgba(12,24,43,.88);
  box-shadow:0 14px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(14px);
}
.translation-area:fullscreen .audio-player .progress-container,
.translation-area.translation-focus .audio-player .progress-container {
  margin-bottom:10px;
}
.translation-area:fullscreen .audio-player .btn-play-pause,
.translation-area.translation-focus .audio-player .btn-play-pause {
  width:46px;
  height:46px;
}
.translation-area:fullscreen .translation-tools,
.translation-area.translation-focus .translation-tools {
  position:absolute;
  top:12px;
  left:14px;
  z-index:5;
  gap:6px;
}
.translation-area:fullscreen .translation-tools button,
.translation-area.translation-focus .translation-tools button {
  min-width:42px;
  min-height:40px;
  padding:7px 10px;
  background:rgba(10,23,42,.68);
  border-color:rgba(148,163,184,.22);
  color:#dbeafe;
}
.translation-area:fullscreen .translation-tools .fullscreen,
.translation-area.translation-focus .translation-tools .fullscreen {
  order:-1;
  color:#67e8f9;
}
body.translation-focus-lock { overflow:hidden; }
body.translation-focus-lock .translation-area.translation-focus {
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  height:100dvh !important;
  max-height:none !important;
  border-radius:0 !important;
  overflow:hidden !important;
  z-index:2147483000 !important;
}
.translation-area .fullscreen i { color:#38bdf8; }
@media(max-width:600px) {
  .translation-area:fullscreen,
  .translation-area.translation-focus {
    padding:12px 10px max(12px,env(safe-area-inset-bottom));
    gap:10px;
  }
  .translation-area:fullscreen .translation-text,
  .translation-area.translation-focus .translation-text {
    width:100%;
    padding:18px 12px;
    font-size:clamp(25px,7vw,38px);
    line-height:1.85;
  }
  .translation-area:fullscreen .transcript-list,
  .translation-area.translation-focus .transcript-list {
    max-height:24vh;
    padding:6px;
  }
  .translation-area:fullscreen .audio-player,
  .translation-area.translation-focus .audio-player {
    padding:9px 10px;
  }
  .translation-area:fullscreen .translation-tools,
  .translation-area.translation-focus .translation-tools {
    top:8px;
    left:8px;
  }
}

.players-search-wrap{grid-column:1/-1;width:100%;max-width:760px;justify-self:center;position:relative;margin:0 auto 2px}
.players-search{width:100%;padding:14px 48px 14px 16px;border-radius:14px;border:1px solid rgba(148,163,184,.22);background:#1e293b;color:#f8fafc;font:inherit;font-size:1rem;outline:none;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.players-search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.13)}
.players-search::placeholder{color:#94a3b8}
.players-search-icon{position:absolute;right:17px;top:50%;transform:translateY(-50%);color:#38bdf8;pointer-events:none}
.players-search-count{display:block;color:#94a3b8;font-size:.85rem;margin:7px 5px 0}
.page-status {
  color:var(--text-muted);
  text-align:center;
  padding:35px 10px;
  font-size:15px;
}

@media(min-width:900px) {
  #playersList:has(.page-container:nth-child(2)) {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .page-container { padding:25px 30px; max-width:700px; }
  .translation-area { padding:24px; }
  .translation-text { font-size:clamp(24px,2.4vw,34px); }
  .transcript-list { max-height:460px; }
}
@media(max-width:700px) {
  body { padding:10px; }
  #playersList, #playersList:has(.page-container:nth-child(2)) {
    grid-template-columns:minmax(0,1fr);
    gap:14px;
  }
  .page-container {
    width:100%;
    max-width:600px;
    padding:clamp(16px,4vw,22px);
    gap:18px;
    border-radius:20px;
  }
  /* نفس ترتيب التصميم المرجعي: الصورة ثم العنوان والقناة ثم زر التحميل */
  .top-meta-bar {
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
  }
  .meta-container {
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
  }
  .track-info { align-items:center; text-align:center; }
  .poster-container {
    width:clamp(82px,21vw,100px);
    height:clamp(82px,21vw,100px);
  }
  .track-title { font-size:clamp(1.3rem,4.8vw,1.55rem); }
  .track-channel {
    justify-content:center;
    font-size:clamp(.88rem,3.2vw,1rem);
  }
  .btn-download-special {
    align-self:center;
    width:64px;
    height:44px;
    margin-top:1px;
  }
  .audio-player { padding:clamp(15px,3.8vw,20px); }
  .player-controls { gap:8px; }
  .center-playback-group { gap:clamp(10px,3vw,16px); }
  .btn-skip { width:36px; height:36px; }
  .btn-play-pause { width:54px; height:54px; }
  .player-extra-actions { gap:8px; }
  .player-extra-actions button { font-size:.9rem; padding:11px 8px; }
  .translation-area { padding:15px 12px; gap:12px; }
  .translation-text { font-size:clamp(19px,5vw,23px); min-height:88px; line-height:1.85; }

const SHEET_ID = "1rL5l72HK8KccymCdpfQE1eITLv-d-MNl0I-fIcpNgPA";

const requestedId = pageParams.get("id");
const standaloneMode = pageParams.get("view") === "standalone";
if (window.self !== window.top) document.body.classList.add("is-embedded");
if (standaloneMode) document.body.classList.add("is-standalone-player");

function getCell(row,index) {
  const cell = row.c?.[index];
  return cell?.v ?? cell?.f ?? "";
}

function getCellRaw(row,index) {
  const cell = row.c?.[index];
  return cell?.v ?? cell?.f ?? "";
}

// Supports either one complete SRT document in a single cell,
// or one SRT line per spreadsheet row in the translation column.
function collectSrtFromRows(rows,startIndex) {
  const fragments = [];

  for (let i = startIndex; i < rows.length; i++) {
    const row = rows[i];
    const hasRecord = [0,1,2,3,4].some(index =>
      String(getCellRaw(row,index) ?? "").trim() !== ""
    );

    // The current row is the player record. Stop only when the next player begins.
    if (i > startIndex && hasRecord) break;

    const value = String(getCellRaw(row,5) ?? "");
    if (value !== "") fragments.push(value);
  }

  return fragments.join("\n").trim();
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return min + ":" + String(sec).padStart(2,"0");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function parseTranslation(value) {
  if (!value) return {lines:[], plain:""};
  return {lines:parseSrt(value), plain:""};
}

function parseSrt(srt) {
  const source = String(srt || "").replace(/^\\uFEFF/, "").replace(/\\r/g, "").trim();
  if (!source) return [];

  const toSeconds = value => {
    const match = String(value).trim().match(/^(?:(\\d+):)?(\\d{2}):(\\d{2})[,.](\\d{1,3})$/);
    if (!match) return NaN;
    const hours = Number(match[1] || 0);
    const minutes = Number(match[2]);
    const seconds = Number(match[3]);
    const milliseconds = Number((match[4] + "00").slice(0,3));
    if (minutes > 59 || seconds > 59) return NaN;
    return hours * 3600 + minutes * 60 + seconds + milliseconds / 1000;
  };

  // Parse by timing lines, not blank blocks: Sheets may remove blank separator rows.
  const rows = source.split("\n").map(line => line.trim());
  const lines = [];
  for (let i = 0; i < rows.length; i++) {
    if (!rows[i].includes("-->")) continue;
    const timing = rows[i].split("-->");
    if (timing.length !== 2) continue;

    const start = toSeconds(timing[0]);
    const end = toSeconds(timing[1].split(/\\s+/)[0]);
    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) continue;

    const textParts = [];
    for (let j = i + 1; j < rows.length && !rows[j].includes("-->"); j++) {
      if (rows[j] && !/^\\d+$/.test(rows[j])) {
        textParts.push(rows[j].replace(/<[^>]*>/g, "").trim());
      }
    }
    const text = textParts.join(" ").trim();
    if (text) lines.push({start,end,text});
  }
  return lines.sort((a,b) => a.start - b.start);
}

    </button>
      <button class="transcript-toggle" type="button" aria-pressed="false">

      </button>

        <button class="fullscreen">

        </button>
      </div>
    </section>
  `;

  playersList.appendChild(card);
  // إعادة البطاقة إلى المستدعي لتمكين البحث دون إعادة إنشاء المشغل.
  const audio = card.querySelector("audio");
  const playButton = card.querySelector(".btn-play-pause");
  const playIcon = playButton.querySelector("i");
  const timeline = card.querySelector(".timeline");
  const progressBar = card.querySelector(".progress-bar");
  const currentLabel = card.querySelector(".currentTime");
  const durationLabel = card.querySelector(".duration");
  const speedButton = card.querySelector(".btn-speed");
  const speedMenu = card.querySelector(".speed-menu");
  const loopButton = card.querySelector(".btn-loop");
  const downloadButton = card.querySelector(".downloadBtn");

  const embedButton = card.querySelector("button.embed-toggle");
  // واجهة التضمين لا تظهر للزوار العاديين؛ افتح لوحة النسخ بإضافة ?admin=1.
  const isEmbedAdmin = new URLSearchParams(location.search).get("admin") === "1";
  embedButton.hidden = !isEmbedAdmin;
  embedButton.addEventListener("click", async () => {
    const embedUrl = new URL("Player.html", location.href);
    embedUrl.searchParams.set("id", String(record.id));
    embedUrl.searchParams.set("view", "standalone");
    const title = String(record.name || "مشغل الشارة").replace(/["<>]/g, "");
    const snippet = '<iframe src="' + embedUrl.href + '" title="' + title +
      '" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen ' +
      'webkitallowfullscreen mozallowfullscreen ' +
      'style="display:block;width:100%;height:680px;min-height:520px;border:0;border-radius:18px;overflow:hidden" ' +
      'scrolling="no"></iframe>';
    try {
      await navigator.clipboard.writeText(snippet);
      embedButton.innerHTML = '<i class="fa-solid fa-check"></i> تم نسخ التضمين';
      setTimeout(() => embedButton.innerHTML = '<i class="fa-solid fa-code"></i> نسخ كود التضمين', 2000);
    } catch {
      window.prompt("انسخ كود التضمين:", snippet);
    }
  });

  const translationButton = card.querySelector(".translation-toggle");
  const transcriptButton = card.querySelector(".transcript-toggle");
  const translationArea = card.querySelector(".translation-area");
  const translationText = card.querySelector(".translation-text");

  const translation = parseTranslation(record.translation);
  let captionsEnabled = false;
  let transcriptEnabled = false;
  let fontSize = 24;
  let lastRenderedLine = -1;
  let lastActiveTranscriptLine = -2;

  function updateTranslationPanel() {
    translationArea.classList.toggle("visible", captionsEnabled || transcriptEnabled);
    translationText.style.display = captionsEnabled ? "block" : "none";
    const list = translationArea.querySelector(".transcript-list");
    if (list) list.classList.toggle("visible", transcriptEnabled);
    translationButton.classList.toggle("active", captionsEnabled);
    transcriptButton.classList.toggle("active", transcriptEnabled);
    translationButton.setAttribute("aria-pressed", String(captionsEnabled));
    transcriptButton.setAttribute("aria-pressed", String(transcriptEnabled));
    translationButton.innerHTML = captionsEnabled
      ? '<i class="fa-solid fa-closed-captioning"></i> إيقاف الترجمة المتزامنة'
      : '<i class="fa-solid fa-closed-captioning"></i> إظهار الترجمة المتزامنة';
    transcriptButton.innerHTML = transcriptEnabled
      ? '<i class="fa-solid fa-list"></i> إخفاء النص والتوقيت'
      : '<i class="fa-solid fa-list"></i> عرض النص والتوقيت';
  }

  // نسبة من مدة السطر يكتمل خلالها التمييز البرتقالي (أصغر = أسرع)
  const KARAOKE_SPEED = 0.65;

  function renderKaraokeLine(line, current) {
    const duration = Math.max(0.001, line.end - line.start);
    const progress = Math.max(0, Math.min(0.999999, (current - line.start) / (duration * KARAOKE_SPEED)));
    const words = String(line.text || "").trim().split(/\s+/).filter(Boolean);
    const position = progress * Math.max(1, words.length);
    const activeWord = Math.min(words.length - 1, Math.floor(position));
    const activeProgress = (position - activeWord) * 100;

    if (translationText.dataset.renderedLine !== line.text) {
      translationText.replaceChildren();
      const sweep = document.createElement("span");
      sweep.className = "karaoke-sweep";
      words.forEach((word, index) => {
        if (index) sweep.appendChild(document.createTextNode(" "));
        const wordNode = document.createElement("span");
        wordNode.className = "karaoke-word";
        wordNode.textContent = word;
        sweep.appendChild(wordNode);
      });
      translationText.appendChild(sweep);
      translationText.dataset.renderedLine = line.text;
    }

    translationText.querySelectorAll(".karaoke-word").forEach((wordNode, index) => {
      wordNode.classList.toggle("done", index < activeWord);
      wordNode.style.setProperty("--word-progress",
        index < activeWord ? "100%" : index === activeWord ? activeProgress.toFixed(2) + "%" : "0%");
    });
    translationText.classList.remove("empty");
  }

  audio.src = record.audio;

  // التشغيل والإيقاف
  playButton.onclick = () => {
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  };

  let syncFrame = 0;
  function syncLoop() {
    audio.dispatchEvent(new Event("timeupdate"));
    syncFrame = (!audio.paused && captionsEnabled) ? requestAnimationFrame(syncLoop) : 0;
  }
  function startSyncLoop() {
    if (!syncFrame && !audio.paused && captionsEnabled) syncFrame = requestAnimationFrame(syncLoop);
  }

  audio.addEventListener("play", () => {
    startSyncLoop();
    playIcon.className = "fa-solid fa-pause";
  });

  audio.addEventListener("pause", () => {
    playIcon.className = "fa-solid fa-play";
  });

  audio.addEventListener("loadedmetadata", () => {
    durationLabel.textContent = formatTime(audio.duration);
  });

  // مزامنة الترجمة مع الصوت
  audio.addEventListener("timeupdate", () => {
    const current = audio.currentTime;
    const duration = audio.duration || 0;

    progressBar.style.width =
      duration ? (current / duration * 100) + "%" : "0%";

    currentLabel.textContent = formatTime(current);

    if (!captionsEnabled && !transcriptEnabled) return;

    if (!translation.lines.length) {
      if (captionsEnabled && translation.plain.trim()) {
        translationText.textContent = translation.plain;
        translationText.classList.remove("empty");
      }
      return;
    }

    if (translation.lines.length) {
      const lineIndex = translation.lines.findIndex(item =>
        current >= item.start && current < item.end
      );
      const line = lineIndex >= 0 ? translation.lines[lineIndex] : null;

      if (captionsEnabled) {
        if (line) {
          renderKaraokeLine(line, current);
          lastRenderedLine = lineIndex;
        } else {
          translationText.textContent = "";
          translationText.classList.add("empty");
          lastRenderedLine = -1;
        }
      }

      if (transcriptEnabled) {
        const transcriptRows = translationArea.querySelectorAll(".transcript-line");
        transcriptRows.forEach((row, index) => {
          row.classList.toggle("active", index === lineIndex);
        });
        const activeRow = lineIndex >= 0 ? transcriptRows[lineIndex] : null;
        if (activeRow && lineIndex !== lastActiveTranscriptLine) {
          activeRow.scrollIntoView({block:"nearest",behavior:"smooth"});
        }
        lastActiveTranscriptLine = lineIndex;
      }
    }
  });

  // التقديم والتأخير
  card.querySelector(".forwardBtn").onclick = () => {
    audio.currentTime = Math.min(
      audio.duration || 0,
      audio.currentTime + 10
    );
  };

  card.querySelector(".rewindBtn").onclick = () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  };

  // تحريك شريط الصوت
  function seek(event) {
    if (!audio.duration) return;

    const rect = timeline.getBoundingClientRect();
    const ratio = (rect.right - event.clientX) / rect.width;

    audio.currentTime =
      Math.max(0, Math.min(1, ratio)) * audio.duration;
  }

  timeline.addEventListener("click",seek);

  // التكرار
  loopButton.onclick = () => {
    audio.loop = !audio.loop;
    loopButton.classList.toggle("active-loop",audio.loop);
  };

  // السرعة
  speedButton.onclick = event => {
    event.stopPropagation();
    speedMenu.style.display =
      speedMenu.style.display === "flex" ? "none" : "flex";
  };

  speedMenu.querySelectorAll(".speed-option").forEach(option => {
    option.onclick = () => {
      const speed = Number(option.dataset.speed);

      audio.playbackRate = speed;
      speedButton.textContent = speed + "x";
      speedButton.classList.toggle("active-speed",speed !== 1);

      speedMenu.querySelectorAll(".speed-option")
        .forEach(item => item.classList.remove("selected"));

      option.classList.add("selected");
      speedMenu.style.display = "none";
    };
  });

  // إنشاء قائمة النص والتوقيت مرة واحدة، بشكل مستقل عن الترجمة المتزامنة
  function buildTranscriptList() {
    let list = translationArea.querySelector(".transcript-list");
    if (list) return list;
    list = document.createElement("div");
    list.className = "transcript-list";

    const rowsContainer = document.createElement("div");
    rowsContainer.className = "transcript-rows";
    rowsContainer.style.cssText = "display:flex;flex-direction:column;gap:8px";
    list.appendChild(rowsContainer);

    if (translation.lines.length) {
      translation.lines.forEach(line => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "transcript-line";
        const stamp = document.createElement("span");
        stamp.className = "transcript-time";
        stamp.textContent = formatTime(line.start);
        const words = document.createElement("span");
        words.className = "transcript-words";
        words.textContent = line.text;
        item.append(stamp, words);
        item.addEventListener("click", () => {
          audio.currentTime = line.start;
          audio.play().catch(() => {});
        });
        rowsContainer.appendChild(item);
      });

    } else {
      const message = document.createElement("div");
      message.className = "transcript-empty";
      message.textContent = translation.plain.trim()
        ? "هذه الترجمة نص متصل ولا تحتوي على توقيتات للمزامنة."
        : "لا توجد ترجمة محفوظة لهذه الشارة بعد.";
      rowsContainer.appendChild(message);
    }
    translationText.insertAdjacentElement("afterend", list);
    return list;
  }

  translationButton.onclick = () => {
    captionsEnabled = !captionsEnabled;
    updateTranslationPanel();
    if (captionsEnabled) { audio.dispatchEvent(new Event("timeupdate")); startSyncLoop(); }
  };

  transcriptButton.onclick = () => {
    transcriptEnabled = !transcriptEnabled;
    if (transcriptEnabled) buildTranscriptList();
    updateTranslationPanel();
    if (transcriptEnabled) audio.dispatchEvent(new Event("timeupdate"));
  };

  // تكبير وتصغير
  card.querySelector(".larger").onclick = () => {
    fontSize = Math.min(48,fontSize + 2);
    translationText.style.fontSize = fontSize + "px";
  };

  card.querySelector(".smaller").onclick = () => {
    fontSize = Math.max(14,fontSize - 2);
    translationText.style.fontSize = fontSize + "px";
  };

  // ملء شاشة الترجمة فقط؛ ننقل شريط الصوت داخلها مؤقتًا ونخفي بيانات الشارة
  const fullscreenButton = card.querySelector(".fullscreen");
  const audioPlayer = card.querySelector(".audio-player");
  const audioPlayerPlaceholder = document.createComment("audio-player-position");
  let translationFocus = false;

  function setTranslationFocus(enabled) {
    translationFocus = enabled;
    card.classList.toggle("translation-focus-card", enabled);
    translationArea.classList.toggle("translation-focus", enabled);
    document.body.classList.toggle("translation-focus-lock", enabled);

    if (enabled) {
      if (audioPlayer.parentElement !== translationArea) {
        audioPlayer.parentNode.insertBefore(audioPlayerPlaceholder, audioPlayer);
        translationArea.insertBefore(audioPlayer, translationArea.querySelector(".translation-tools"));
      }
    } else {
      if (audioPlayerPlaceholder.parentNode) {
        audioPlayerPlaceholder.parentNode.insertBefore(audioPlayer, audioPlayerPlaceholder);
        audioPlayerPlaceholder.remove();
      }
    }

    const icon = fullscreenButton.querySelector("i");
    if (icon) icon.className = enabled ? "fa-solid fa-compress" : "fa-solid fa-expand";
    fullscreenButton.setAttribute("aria-label", enabled ? "إنهاء ملء الشاشة" : "ملء شاشة الترجمة");
    fullscreenButton.title = enabled ? "إنهاء ملء الشاشة" : "ملء شاشة الترجمة";
  }

  fullscreenButton.onclick = async () => {
    try {
      if (document.fullscreenElement === translationArea) {
        await document.exitFullscreen();
        return;
      }
      if (translationFocus) {
        setTranslationFocus(false);
        return;
      }
      setTranslationFocus(true);
      if (translationArea.requestFullscreen) {
        await translationArea.requestFullscreen();
      }
    } catch(error) {
      // وضع ملء شاشة بديل داخل التضمين إذا منع المتصفح Fullscreen API
      console.warn("Fullscreen API unavailable; using translation focus mode.", error);
      setTranslationFocus(true);
    }
  };

  document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement !== translationArea && translationFocus) {
      setTranslationFocus(false);
    } else if (document.fullscreenElement === translationArea) {
      setTranslationFocus(true);
    }
  });

  // التحميل
  downloadButton.onclick = async () => {
    const icon = downloadButton.querySelector("i");

    try {
      downloadButton.classList.add("loading-dl");
      icon.className = "fa-solid fa-spinner fa-spin";

      const response = await fetch(record.audio);
      if (!response.ok) throw new Error("Download failed");

      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = blobUrl;
      link.download = (record.name || "audio") + ".mp3";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(blobUrl),1000);

    } catch(error) {
      window.open(record.audio,"_blank");
    } finally {
      downloadButton.classList.remove("loading-dl");
      icon.className = "fa-solid fa-cloud-arrow-down";
    }
  };

  // اختصارات لوحة المفاتيح
  card.addEventListener("keydown",event => {
    if (["BUTTON","INPUT","TEXTAREA","SELECT"].includes(event.target.tagName)) return;

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      audio.currentTime = Math.min(
        audio.duration || 0,
        audio.currentTime + 10
      );
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      audio.currentTime = Math.max(0,audio.currentTime - 10);
    } else if (event.code === "Space") {
      event.preventDefault();
      if (audio.paused) audio.play();
      else audio.pause();
    }
  });
  return card;
}

async function loadAllPlayers() {
  try {
    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:json&headers=0&sheet=" +
      encodeURIComponent(SHEET_NAME);

    // لا نترك الصفحة معلّقة إلى ما لا نهاية إذا تأخر Google Sheets
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    let response;
    try {
      response = await fetch(url, { signal: controller.signal, cache: "no-store" });
    } catch (networkError) {
      if (networkError.name === "AbortError") {
        throw new Error("استغرق تحميل البيانات وقتًا طويلًا. تحقق من الاتصال ثم أعد المحاولة.");
      }
      throw new Error("تعذر الاتصال بمصدر الشارات. تحقق من الإنترنت ثم أعد المحاولة.");
    } finally {
      clearTimeout(timeoutId);
    }

    if (!response.ok) {
      throw new Error("مصدر الشارات أعاد خطأ (" + response.status + "). أعد المحاولة لاحقًا.");
    }

    const raw = await response.text();
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");

    if (start < 0 || end < 0) {
      throw new Error("استجابة غير صحيحة");
    }

    const data = JSON.parse(raw.slice(start,end + 1));
    const rows = data.table.rows || [];

    const records = rows.map((row,index) => ({
      id:getCell(row,0),
      image:getCell(row,1),
      name:getCell(row,2),
      channel:getCell(row,3),
      audio:getCell(row,4),
      // If SRT is split over multiple rows in column F, collect its continuation rows.
      translation: collectSrtFromRows(rows,index)
    })).filter(item =>
      String(item.id).trim() !== "" &&
      String(item.name).trim() !== "" &&
      String(item.audio).trim() !== ""
    );

    const visibleRecords = requestedId
      ? records.filter(item => String(item.id).trim() === requestedId.trim())
      : records;

    playersList.innerHTML = "";

    if (!visibleRecords.length) {
      playersList.innerHTML =
        '<div class="page-status">لا توجد شارات مكتملة في ورقة Player.</div>';
      return;
    }

    if (!requestedId) {
      const searchWrap = document.createElement("div");
      searchWrap.className = "players-search-wrap";
      searchWrap.innerHTML = '<i class="fa-solid fa-magnifying-glass players-search-icon"></i><input class="players-search" type="search" placeholder="ابحث عن مسلسل أو شارة..." aria-label="البحث عن مسلسل أو شارة"><span class="players-search-count" aria-live="polite"></span>';
      playersList.appendChild(searchWrap);
      const searchInput = searchWrap.querySelector(".players-search");
      const searchCount = searchWrap.querySelector(".players-search-count");
      const normalizeTitle = value => String(value || "")
        .toLocaleLowerCase("ar")
        .normalize("NFD")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").trim();
      const cards = visibleRecords.map(record => {
        const card = createPlayer(record);
        card.dataset.searchText = normalizeTitle(record.name + " " + record.channel);
        return card;
      });
      const filterPlayers = () => {
        const query = normalizeTitle(searchInput.value);
        let shown = 0;
        cards.forEach(card => {
          const match = !query || card.dataset.searchText.includes(query);
          card.hidden = !match;
          if (match) shown++;
        });
        searchCount.textContent = query ? shown + " نتيجة من " + cards.length : cards.length + " مسلسل / شارة";
        let empty = playersList.querySelector(".players-search-empty");
        if (!empty) {
          empty = document.createElement("div");
          empty.className = "page-status players-search-empty";
          empty.textContent = "ما لقينا نتائج مطابقة لبحثك.";
          playersList.appendChild(empty);
        }
        empty.hidden = shown !== 0;
      };
      searchInput.addEventListener("input", filterPlayers);
      filterPlayers();
    } else {
      visibleRecords.forEach(record => createPlayer(record));
    }

  } catch(error) {
    console.error("Player loading error:",error);

    const message = error && error.message
      ? error.message
      : "تعذر تحميل الشارات حاليًا.";
    playersList.innerHTML = "";
    const status = document.createElement("div");
    status.className = "page-status";
    status.textContent = message;
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "translation-toggle";
    retry.style.maxWidth = "260px";
    retry.style.margin = "0 auto";
    retry.textContent = "إعادة تحميل الشارات";
    retry.addEventListener("click", () => {
      playersList.innerHTML = '<div class="page-status">جاري إعادة تحميل الشارات...</div>';
      loadAllPlayers();
    });
    playersList.append(status, retry);
  }
}

loadAllPlayers();
</script>
</body>
</html>
